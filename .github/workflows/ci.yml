name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --all-targets --features "uuid test-util swagger multipart tls http2 compression"

      - name: Run doctests
        run: cargo test --doc --workspace

      - name: Build examples
        run: cargo build --workspace --examples --features "uuid swagger tls http2"

      - name: Run Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy and tests for TLS without HTTP/2
        run: |
          cargo clippy --workspace --all-targets --features tls -- -D warnings
          cargo test --features tls --test tls

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  miri-inline-future:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust and Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Check pinned inline futures with Miri
        run: cargo miri test --lib inline_future --

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Audit dependencies, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
