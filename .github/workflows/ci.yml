name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --all-targets --features "uuid test-util swagger"

      - name: Run doctests
        run: cargo test --doc --workspace

      - name: Build examples
        run: cargo build --workspace --examples --features "uuid swagger"

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  miri-inline-future:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust and Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Check pinned inline futures with Miri
        run: cargo miri test --lib inline_future --
