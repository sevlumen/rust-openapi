name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Run doctests
        run: cargo test --doc --workspace

      - name: Build examples
        run: cargo build --workspace --examples

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test benchmark harness guards
        shell: pwsh
        run: |
          pwsh -File ./benchmarks/tests/test-oha-adapter.ps1
          pwsh -File ./benchmarks/tests/test-matrix-guard.ps1

      - name: Validate benchmark topology
        run: docker compose -f benchmarks/docker-compose.yml config --quiet

      - name: Build benchmark images
        run: docker compose -f benchmarks/docker-compose.yml build

  miri-inline-future:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust and Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Check pinned inline future with Miri
        run: cargo miri test --lib inline_future_preserves_pinned_application_future -- --exact
