[package]
name = "oas-rs"
version = "0.7.0"
edition = "2024"
description = "A small, typed OpenAPI-first HTTP framework on Hyper and Tokio"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/sevlumen/rust-openapi"
readme = "README.md"
keywords = ["openapi", "http", "hyper", "tokio", "web"]
categories = ["web-programming::http-server"]
exclude = ["/.github", "/.gitattributes", "/CLAUDE.md", "/deny.toml", "/docs", "/scripts", "/dist", "/wip"]

[workspace]
members = [".", "oas-rs-macros"]

[features]
default = []
uuid = ["dep:uuid"]
test-util = []
swagger = []
multipart = ["dep:multer"]
tls = ["dep:tokio-rustls", "dep:rustls-pki-types"]
compression = ["dep:flate2"]
http2 = ["tls", "hyper/http2", "hyper-util/http2"]

[lib]
name = "oas_rs"
path = "src/lib.rs"

[dependencies]
bytes = "1.10"
futures-core = "0.3"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "tokio", "server-graceful"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
oas-rs-macros = { version = "=0.7.0", path = "oas-rs-macros" }
uuid = { version = "1.17", optional = true, features = ["serde", "v4"] }
multer = { version = "3", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
flate2 = { version = "1", optional = true }

# Only applies when building this workspace (benches, examples); dependents use
# their own profiles.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1", "http2"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
trybuild = "1.0"
uuid = { version = "1.17", features = ["serde", "v4"] }
tokio = { version = "1.45", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

[[bench]]
name = "router"
harness = false
required-features = ["uuid", "test-util", "swagger"]

[[test]]
name = "acceptance"
required-features = ["uuid", "test-util", "swagger"]

[[test]]
name = "fuzz_smoke"
required-features = ["test-util"]

[[example]]
name = "hello"
required-features = ["swagger"]

[[example]]
name = "users-api"
required-features = ["uuid", "swagger"]

[[example]]
name = "tls"
required-features = ["tls"]

[[test]]
name = "middleware"
required-features = ["test-util"]

[[test]]
name = "body_limit"
required-features = ["test-util"]

[[test]]
name = "multipart"
required-features = ["multipart", "test-util"]

[[test]]
name = "tls"
required-features = ["tls"]

[[test]]
name = "http2"
required-features = ["http2"]

[[test]]
name = "scoped_middleware"
required-features = ["test-util"]

[[test]]
name = "robustness"
required-features = ["test-util"]

[[test]]
name = "openapi_errors"
required-features = ["test-util"]

[[test]]
name = "cors"
required-features = ["test-util"]

[[test]]
name = "headers"
required-features = ["test-util"]

[[test]]
name = "error_format"
required-features = ["test-util"]

[[test]]
name = "rate_limit"
required-features = ["test-util"]

[[test]]
name = "compress"
required-features = ["compression", "test-util"]
